<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>canopy baseline（T021.6 13 树种冠形基线帧——最小渲染 harness，无 Runtime 接线）</title>
  <script>
    // console 捕获（先于 three/材质模块加载注入——沿 011.9 compile-check 先例）
    window.__CANOPY_ERRORS = [];
    window.__CANOPY_WARNINGS = [];
    (function () {
      var oe = console.error, ow = console.warn;
      console.error = function () {
        window.__CANOPY_ERRORS.push(Array.prototype.map.call(arguments, String).join(' '));
        oe.apply(console, arguments);
      };
      console.warn = function () {
        window.__CANOPY_WARNINGS.push(Array.prototype.map.call(arguments, String).join(' '));
        ow.apply(console, arguments);
      };
      window.addEventListener('error', function (e) { window.__CANOPY_ERRORS.push('window.onerror: ' + e.message); });
      window.addEventListener('unhandledrejection', function (e) { window.__CANOPY_ERRORS.push('unhandledrejection: ' + String(e.reason)); });
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #20242a; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module" src="./canopy-baseline-page.ts"></script>
</body>
</html>
