<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>fade dither 冒烟（T021.3 过渡 dither 材质面——InstancedMesh 真实消费路径最小 harness）</title>
  <script>
    // console 捕获（先于 three/材质模块加载注入——沿 011.9 compile-check / 021.6 canopy-baseline 先例）
    window.__FADE_ERRORS = [];
    window.__FADE_WARNINGS = [];
    (function () {
      var oe = console.error, ow = console.warn;
      console.error = function () {
        window.__FADE_ERRORS.push(Array.prototype.map.call(arguments, String).join(' '));
        oe.apply(console, arguments);
      };
      console.warn = function () {
        window.__FADE_WARNINGS.push(Array.prototype.map.call(arguments, String).join(' '));
        ow.apply(console, arguments);
      };
      window.addEventListener('error', function (e) { window.__FADE_ERRORS.push('window.onerror: ' + e.message); });
      window.addEventListener('unhandledrejection', function (e) { window.__FADE_ERRORS.push('unhandledrejection: ' + String(e.reason)); });
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #20242a; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module" src="./fade-smoke-page.ts"></script>
</body>
</html>
